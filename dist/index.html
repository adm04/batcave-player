<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WAYNE ACOUSTICS · Δ-1939 Tape Deck</title>
<style>
  :root{
    --void:#050507;
    --cave-1:#0c0c11;
    --cave-2:#17171f;
    --panel:#1b1b22;
    --panel-hi:#26262f;
    --panel-lo:#121217;
    --bat-yellow:#f5c518;
    --bat-yellow-dim:#8a6f0c;
    --amber:#ffb703;
    --led-red:#ff3b30;
    --steel:#6b7688;
    --cream:#ece7d6;
    --line:#33333d;
    --font-display: 'Oswald','Arial Narrow','Helvetica Neue',Impact,sans-serif;
    --font-mono: 'Courier New', ui-monospace, 'SFMono-Regular', monospace;
    --font-body: -apple-system, 'Segoe UI', Roboto, sans-serif;
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(ellipse 120% 60% at 50% -10%, #1a1a22 0%, var(--cave-1) 55%, var(--void) 100%);
    color:var(--cream);
    font-family:var(--font-body);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 16px 60px;
    overflow-x:hidden;
    position:relative;
  }

  /* ---------- background atmosphere ---------- */
  .sky{
    position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden;
  }
  .stars{
    position:absolute; inset:0;
    background-image:
      radial-gradient(1px 1px at 10% 20%, #ffffff55 50%, transparent 51%),
      radial-gradient(1px 1px at 80% 10%, #ffffff40 50%, transparent 51%),
      radial-gradient(1px 1px at 60% 30%, #ffffff35 50%, transparent 51%),
      radial-gradient(1px 1px at 30% 15%, #ffffff45 50%, transparent 51%),
      radial-gradient(1px 1px at 90% 40%, #ffffff30 50%, transparent 51%),
      radial-gradient(1px 1px at 45% 8%, #ffffff40 50%, transparent 51%),
      radial-gradient(1px 1px at 20% 45%, #ffffff25 50%, transparent 51%),
      radial-gradient(1px 1px at 70% 22%, #ffffff35 50%, transparent 51%);
    opacity:.7;
  }
  .beam-wrap{
    position:absolute; left:50%; bottom:18%; width:6px; height:1400px;
    transform-origin:bottom center;
    transform:translateX(-50%) rotate(-22deg);
    opacity:0;
    transition:opacity .8s ease;
  }
  body.powered .beam-wrap{
    opacity:1;
    animation:beam-sweep 9s ease-in-out infinite;
  }
  .beam{
    width:100%; height:100%;
    background:linear-gradient(to top, rgba(245,197,24,.16), rgba(245,197,24,.03) 60%, transparent 100%);
    clip-path:polygon(46% 100%, 54% 100%, 100% 0%, 0% 0%);
    filter:blur(1px);
  }
  @keyframes beam-sweep{
    0%,100%{ transform:translateX(-50%) rotate(-26deg); }
    50%{ transform:translateX(-50%) rotate(26deg); }
  }
  .skyline{
    position:absolute; left:0; right:0; bottom:0; height:22vh; min-height:140px;
    fill:#0a0a0e;
    opacity:.9;
  }
  .grain{
    position:absolute; inset:0;
    background-image:repeating-linear-gradient(0deg, rgba(255,255,255,.025) 0px, transparent 1px, transparent 2px);
    mix-blend-mode:overlay;
    opacity:.5;
  }

  /* ---------- deck ---------- */
  .rig{
    position:relative; z-index:1;
    width:100%; max-width:560px;
    display:flex; flex-direction:column; align-items:center; gap:22px;
  }

  .brandline{
    text-align:center;
  }
  .brandline .kicker{
    font-family:var(--font-mono);
    font-size:11px;
    letter-spacing:.35em;
    color:var(--steel);
    text-transform:uppercase;
  }
  .brandline h1{
    margin:4px 0 0;
    font-family:var(--font-display);
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.06em;
    font-size:clamp(28px, 6vw, 40px);
    color:var(--cream);
  }
  .brandline h1 span{ color:var(--bat-yellow); }

  .deck{
    width:100%;
    background:
      linear-gradient(180deg, var(--panel-hi), var(--panel) 12%, var(--panel) 88%, var(--panel-lo));
    border-radius:18px;
    padding:20px 20px 24px;
    box-shadow:
      0 30px 60px -20px rgba(0,0,0,.8),
      0 0 0 1px #000,
      inset 0 1px 0 rgba(255,255,255,.05),
      inset 0 -2px 12px rgba(0,0,0,.5);
    position:relative;
  }
  .deck::before{
    /* brushed metal texture */
    content:"";
    position:absolute; inset:0; border-radius:18px;
    background:repeating-linear-gradient(100deg, rgba(255,255,255,.015) 0px, rgba(255,255,255,.015) 1px, transparent 1px, transparent 3px);
    pointer-events:none;
  }

  .deck-top{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:14px;
  }
  .plate{
    font-family:var(--font-mono);
    font-size:10px;
    letter-spacing:.15em;
    color:var(--steel);
  }
  .plate b{ color:var(--bat-yellow-dim); }

  /* power switch */
  .switch-unit{ display:flex; align-items:center; gap:10px; }
  .led{
    width:9px; height:9px; border-radius:50%;
    background:var(--led-red);
    box-shadow:0 0 4px rgba(255,59,48,.6);
    animation:led-idle 2.6s ease-in-out infinite;
  }
  body.powered .led{
    background:var(--bat-yellow);
    box-shadow:0 0 8px 2px rgba(245,197,24,.85);
    animation:none;
  }
  @keyframes led-idle{
    0%,100%{ opacity:.35; }
    50%{ opacity:1; }
  }
  .toggle{
    width:52px; height:26px;
    border-radius:6px;
    background:#0e0e12;
    border:1px solid #000;
    box-shadow:inset 0 2px 4px rgba(0,0,0,.7), inset 0 -1px 0 rgba(255,255,255,.04);
    position:relative;
    cursor:pointer;
    padding:2px;
  }
  .toggle .knob{
    width:22px; height:20px;
    border-radius:4px;
    background:linear-gradient(180deg,#3a3a44,#222228);
    box-shadow:0 2px 3px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.15);
    position:absolute; top:2px; left:2px;
    transition:left .18s cubic-bezier(.6,.2,.2,1), background .18s;
  }
  body.powered .toggle .knob{
    left:28px;
    background:linear-gradient(180deg,var(--bat-yellow),#b8940e);
  }
  .toggle-label{
    font-family:var(--font-mono); font-size:9px; letter-spacing:.1em; color:var(--steel); text-align:center; margin-top:4px;
  }

  /* LCD screen */
  .screen{
    background:#0a0d09;
    border-radius:8px;
    padding:14px 16px;
    box-shadow:inset 0 2px 10px rgba(0,0,0,.85), inset 0 0 0 1px #000;
    position:relative;
    overflow:hidden;
    filter:brightness(.35) saturate(.4);
    transition:filter .5s ease;
  }
  body.powered .screen{ filter:brightness(1) saturate(1); }
  .screen::after{
    content:"";
    position:absolute; inset:0;
    background:repeating-linear-gradient(0deg, rgba(0,0,0,.25) 0px, transparent 1px, transparent 3px);
    pointer-events:none;
  }
  .screen-row1{
    display:flex; justify-content:space-between; align-items:baseline;
    font-family:var(--font-mono); font-size:10px; letter-spacing:.1em;
    color:#c9d94a; text-transform:uppercase; margin-bottom:6px;
  }
  .track-title{
    font-family:var(--font-display);
    font-size:18px; letter-spacing:.05em; text-transform:uppercase;
    color:var(--amber);
    text-shadow:0 0 6px rgba(255,183,3,.5);
    white-space:nowrap; overflow:hidden;
    margin-bottom:10px;
    height:22px;
  }
  .track-title span{
    display:inline-block;
    padding-left:2px;
  }
  .eq{
    display:flex; align-items:flex-end; gap:3px; height:34px; margin-bottom:8px;
  }
  .eq i{
    flex:1; background:linear-gradient(180deg, var(--amber), #7a5300);
    height:6%;
    border-radius:1px 1px 0 0;
    transition:height .08s linear;
    box-shadow:0 0 4px rgba(255,183,3,.35);
  }
  .counter-row{
    display:flex; justify-content:space-between; align-items:center;
    font-family:var(--font-mono); font-size:10px; color:#8fa06a; letter-spacing:.08em;
  }
  .counter{
    background:#000; border-radius:3px; padding:3px 7px;
    color:var(--amber); font-size:13px; letter-spacing:.12em;
    box-shadow:inset 0 0 4px rgba(0,0,0,.9);
  }

  /* cassette window */
  .cassette-window{
    margin-top:16px;
    background:#08080a;
    border-radius:10px;
    padding:18px 22px;
    box-shadow:inset 0 3px 14px rgba(0,0,0,.9), inset 0 0 0 1px #000;
    position:relative;
  }
  .tape-body{
    background:linear-gradient(180deg, #d6cfae, #bfb68f);
    border-radius:6px;
    padding:16px 18px 10px;
    position:relative;
    box-shadow:0 6px 14px rgba(0,0,0,.5), inset 0 0 0 1px rgba(0,0,0,.15);
    opacity:.35;
    filter:grayscale(.6);
    transition:opacity .4s ease, filter .4s ease;
  }
  body.powered .tape-body{ opacity:1; filter:grayscale(0); }
  .tape-label{
    background:var(--cream);
    border:2px solid #1a1a1a;
    border-radius:3px;
    padding:6px 10px 8px;
    text-align:center;
    margin-bottom:10px;
  }
  .tape-label .cat{
    font-family:var(--font-mono); font-size:8px; letter-spacing:.2em; color:#555;
  }
  .tape-label .name{
    font-family:var(--font-display); font-size:13px; letter-spacing:.04em;
    color:#111; text-transform:uppercase;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .reels{
    display:flex; justify-content:space-between; align-items:center; padding:0 6px;
  }
  .reel{
    width:56px; height:56px; border-radius:50%;
    background:radial-gradient(circle at 50% 50%, #1a1a1a 0 14%, #2b2b2b 14% 18%, #1a1a1a 18% 100%);
    display:flex; align-items:center; justify-content:center;
    box-shadow:inset 0 0 0 2px #0006, 0 1px 2px rgba(0,0,0,.4);
    animation:spin-reel 3.2s linear infinite;
    animation-play-state:paused;
  }
  body.playing .reel{ animation-play-state:running; }
  .reel svg{ width:100%; height:100%; }
  @keyframes spin-reel{ to{ transform:rotate(360deg); } }
  .tape-window-strip{
    position:absolute; left:50%; top:44%; transform:translate(-50%,-50%);
    width:120px; height:14px; background:#0a0a0a; border-radius:2px;
    box-shadow:inset 0 0 3px #000;
  }
  .screws{ position:absolute; width:6px; height:6px; border-radius:50%; background:#3a3a2f; box-shadow:inset 0 1px 1px #000, 0 1px 0 rgba(255,255,255,.15);}
  .s1{ top:8px; left:8px;} .s2{ top:8px; right:8px;} .s3{ bottom:8px; left:8px;} .s4{ bottom:8px; right:8px;}

  /* transport controls */
  .transport{
    display:flex; align-items:center; justify-content:center; gap:10px;
    margin-top:18px;
  }
  .tbtn{
    width:52px; height:44px;
    background:linear-gradient(180deg, var(--panel-hi), var(--panel-lo));
    border:1px solid #000;
    border-radius:7px;
    box-shadow:0 3px 0 #000, inset 0 1px 0 rgba(255,255,255,.08);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    color:var(--cream);
    transition:transform .06s ease, box-shadow .06s ease;
  }
  .tbtn:active{ transform:translateY(2px); box-shadow:0 1px 0 #000, inset 0 1px 0 rgba(255,255,255,.08); }
  .tbtn.play{
    width:64px; height:52px;
    background:linear-gradient(180deg, var(--bat-yellow), #a97e0a);
    box-shadow:0 4px 0 #6e5106, inset 0 1px 0 rgba(255,255,255,.3);
  }
  .tbtn.play:active{ transform:translateY(3px); box-shadow:0 1px 0 #6e5106; }
  .tbtn svg{ width:16px; height:16px; fill:currentColor; }
  .tbtn.play svg{ fill:#1a1305; width:18px; height:18px; }
  .tbtn[disabled]{ opacity:.4; cursor:not-allowed; }

  .lowerbar{
    display:flex; align-items:center; justify-content:space-between;
    margin-top:16px; gap:16px; flex-wrap:wrap;
  }
  .vol-unit{ display:flex; align-items:center; gap:8px; }
  .vol-label{ font-family:var(--font-mono); font-size:9px; letter-spacing:.15em; color:var(--steel); }
  .knob-wrap{ display:flex; flex-direction:column; align-items:center; gap:4px; }
  .knob{
    width:38px; height:38px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #3a3a44, #17171d 70%);
    box-shadow:0 2px 4px rgba(0,0,0,.6), inset 0 0 0 1px #000;
    position:relative; cursor:pointer;
    touch-action:none;
  }
  .knob .tick{
    position:absolute; top:3px; left:50%; width:2px; height:9px;
    background:var(--bat-yellow); border-radius:1px;
    transform-origin:1px 16px;
    transform:translateX(-50%) rotate(0deg);
  }

  .eject{
    display:flex; align-items:center; gap:8px;
    background:transparent; border:1px solid var(--line);
    color:var(--steel); font-family:var(--font-mono); font-size:10px; letter-spacing:.1em;
    padding:8px 12px; border-radius:6px; cursor:pointer; text-transform:uppercase;
  }
  .eject:hover{ border-color:var(--bat-yellow-dim); color:var(--bat-yellow); }
  input[type="file"]{ display:none; }

  /* tape shelf */
  .shelf{
    width:100%; max-width:560px;
  }
  .shelf-label{
    font-family:var(--font-mono); font-size:10px; letter-spacing:.2em; color:var(--steel);
    text-transform:uppercase; margin-bottom:10px; padding-left:2px;
  }
  .shelf-row{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(120px,1fr)); gap:10px;
  }
  .tape-card{
    background:linear-gradient(180deg,#d6cfae,#b9b088);
    border-radius:5px;
    padding:8px 9px 10px;
    cursor:pointer;
    border:2px solid transparent;
    position:relative;
    transition:transform .1s ease, border-color .15s ease;
  }
  .tape-card:hover{ transform:translateY(-2px); }
  .tape-card.active{ border-color:var(--bat-yellow); box-shadow:0 0 0 1px var(--bat-yellow), 0 0 12px rgba(245,197,24,.3); }
  .tape-card .cat{
    font-family:var(--font-mono); font-size:7px; letter-spacing:.15em; color:#555;
  }
  .tape-card .name{
    font-family:var(--font-display); font-size:12px; color:#111; text-transform:uppercase; letter-spacing:.02em;
    line-height:1.2; margin-top:2px;
    overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
  }
  .tape-card .reel-mini{
    display:flex; gap:6px; margin-top:8px;
  }
  .tape-card .reel-mini i{
    width:14px; height:14px; border-radius:50%;
    background:radial-gradient(circle, #111 0 30%, #333 30% 40%, #111 40% 100%);
  }
  .tape-card.upload{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:transparent; border:1.5px dashed var(--line); color:var(--steel);
    text-align:center; gap:6px; min-height:78px;
  }
  .tape-card.upload:hover{ border-color:var(--bat-yellow-dim); color:var(--bat-yellow); }
  .tape-card.upload .plus{ font-size:18px; font-family:var(--font-display); }
  .tape-card.upload span{ font-family:var(--font-mono); font-size:8px; letter-spacing:.1em; text-transform:uppercase; }

  .footnote{
    text-align:center; margin-top:6px;
    font-family:var(--font-mono); font-size:9px; letter-spacing:.08em; color:#3d3d47;
  }

  @media (max-width:420px){
    .tbtn{ width:44px; height:38px; }
    .tbtn.play{ width:56px; height:46px; }
    .reel{ width:48px; height:48px; }
  }

  @media (prefers-reduced-motion: reduce){
    .beam-wrap, .reel, .led{ animation:none !important; }
  }
</style>
</head>
<body>

<div class="sky" aria-hidden="true">
  <div class="stars"></div>
  <div class="beam-wrap"><div class="beam"></div></div>
  <svg class="skyline" viewBox="0 0 800 140" preserveAspectRatio="none">
    <path d="M0,140 L0,90 L20,90 L20,70 L40,70 L40,95 L60,95 L60,50 L70,50 L70,40 L80,40 L80,95 L100,95 L100,60 L120,60 L120,100 L140,100 L140,75 L155,75 L155,55 L165,55 L165,75 L180,75 L180,100 L210,100 L210,65 L225,65 L225,45 L235,45 L235,65 L250,65 L250,100 L280,100 L280,80 L300,80 L300,30 L310,30 L310,20 L320,20 L320,30 L330,30 L330,80 L350,80 L350,100 L380,100 L380,55 L400,55 L400,100 L430,100 L430,70 L450,70 L450,90 L470,90 L470,60 L485,60 L485,40 L495,40 L495,60 L510,60 L510,90 L540,90 L540,100 L570,100 L570,50 L585,50 L585,35 L595,35 L595,50 L610,50 L610,100 L640,100 L640,75 L660,75 L660,95 L680,95 L680,65 L700,65 L700,100 L730,100 L730,85 L750,85 L750,100 L800,100 L800,140 Z" />
  </svg>
  <div class="grain"></div>
</div>

<div class="rig">

  <div class="brandline">
    <div class="kicker">Wayne Acoustics &middot; Est. 1939</div>
    <h1>Batcave <span>Tape</span> Deck</h1>
  </div>

  <div class="deck">
    <div class="deck-top">
      <div class="plate">MODEL <b>&Delta;-1939</b><br>SERIAL GC-0417</div>
      <div class="switch-unit">
        <div>
          <div class="toggle" id="powerToggle" role="switch" aria-checked="false" aria-label="Power">
            <div class="knob"></div>
          </div>
          <div class="toggle-label">Power</div>
        </div>
        <div class="led" id="led"></div>
      </div>
    </div>

    <div class="screen">
      <div class="screen-row1"><span id="statusText">STANDBY</span><span id="freqText">GTH · 91.9</span></div>
      <div class="track-title" id="trackTitle"><span>—</span></div>
      <div class="eq" id="eq"></div>
      <div class="counter-row">
        <span>TAPE COUNTER</span>
        <span class="counter" id="counter">0000</span>
      </div>
    </div>

    <div class="cassette-window">
      <div class="tape-body">
        <div class="screws s1"></div><div class="screws s2"></div><div class="screws s3"></div><div class="screws s4"></div>
        <div class="tape-label">
          <div class="cat">SIDE A &middot; GOTHAM FM</div>
          <div class="name" id="labelName">Select a tape</div>
        </div>
        <div class="reels">
          <div class="reel">
            <svg viewBox="0 0 56 56"><g fill="none" stroke="#6b6b60" stroke-width="2"><circle cx="28" cy="28" r="15"/><line x1="28" y1="13" x2="28" y2="43"/><line x1="13" y1="28" x2="43" y2="28"/><line x1="17.6" y1="17.6" x2="38.4" y2="38.4"/><line x1="17.6" y1="38.4" x2="38.4" y2="17.6"/></g></svg>
          </div>
          <div class="reel">
            <svg viewBox="0 0 56 56"><g fill="none" stroke="#6b6b60" stroke-width="2"><circle cx="28" cy="28" r="15"/><line x1="28" y1="13" x2="28" y2="43"/><line x1="13" y1="28" x2="43" y2="28"/><line x1="17.6" y1="17.6" x2="38.4" y2="38.4"/><line x1="17.6" y1="38.4" x2="38.4" y2="17.6"/></g></svg>
          </div>
        </div>
        <div class="tape-window-strip"></div>
      </div>
    </div>

    <div class="transport">
      <button class="tbtn" id="prevBtn" title="Previous tape">
        <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zM20 6L9 12l11 6z"/></svg>
      </button>
      <button class="tbtn" id="stopBtn" title="Stop">
        <svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12"/></svg>
      </button>
      <button class="tbtn play" id="playBtn" title="Play/Pause">
        <svg viewBox="0 0 24 24" id="playIcon"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <button class="tbtn" id="nextBtn" title="Next tape">
        <svg viewBox="0 0 24 24"><path d="M18 6h-2v12h2zM4 6l11 6-11 6z"/></svg>
      </button>
    </div>

    <div class="lowerbar">
      <div class="vol-unit">
        <span class="vol-label">VOL</span>
        <div class="knob-wrap">
          <div class="knob" id="volKnob"><div class="tick" id="volTick"></div></div>
        </div>
      </div>
      <label class="eject" id="ejectBtn">
        &#9167; Insert tape
        <input type="file" id="fileInput" accept="audio/*" multiple>
      </label>
    </div>
  </div>

  <div class="shelf">
    <div class="shelf-label">Tape shelf</div>
    <div class="shelf-row" id="shelfRow"></div>
  </div>

  <div class="footnote">Fan-made &middot; Gotham-inspired &middot; unofficial build</div>

</div>

<script>
(function(){
  "use strict";

  const body = document.body;
  const powerToggle = document.getElementById('powerToggle');
  const led = document.getElementById('led');
  const statusText = document.getElementById('statusText');
  const trackTitleEl = document.getElementById('trackTitle');
  const labelName = document.getElementById('labelName');
  const counterEl = document.getElementById('counter');
  const eqEl = document.getElementById('eq');
  const playBtn = document.getElementById('playBtn');
  const playIcon = document.getElementById('playIcon');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const stopBtn = document.getElementById('stopBtn');
  const volKnob = document.getElementById('volKnob');
  const volTick = document.getElementById('volTick');
  const fileInput = document.getElementById('fileInput');
  const shelfRow = document.getElementById('shelfRow');

  const EQ_BARS = 24;
  for(let i=0;i<EQ_BARS;i++){
    const bar = document.createElement('i');
    eqEl.appendChild(bar);
  }
  const eqBars = eqEl.querySelectorAll('i');

  // ---------- audio engine ----------
  let ctx = null;
  let masterGain = null;
  let analyser = null;
  let dataArray = null;
  let currentStopFn = null;
  let counterInterval = null;
  let counterValue = 0;
  let volume = 0.7;
  let powered = false;
  let playing = false;
  let rafId = null;
  let mediaEl = null; // <audio> element for uploaded files

  function ensureCtx(){
    if(!ctx){
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      masterGain = ctx.createGain();
      masterGain.gain.value = volume;
      analyser = ctx.createAnalyser();
      analyser.fftSize = 64;
      dataArray = new Uint8Array(analyser.frequencyBinCount);
      masterGain.connect(analyser);
      analyser.connect(ctx.destination);
    }
    if(ctx.state === 'suspended') ctx.resume();
  }

  // -- synthesized ambient generators --
  function genRain(){
    ensureCtx();
    const bufferSize = 2 * ctx.sampleRate;
    const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for(let i=0;i<bufferSize;i++) data[i] = (Math.random()*2-1)*0.5;
    const noise = ctx.createBufferSource();
    noise.buffer = buffer; noise.loop = true;
    const filter = ctx.createBiquadFilter();
    filter.type='bandpass'; filter.frequency.value=1800; filter.Q.value=0.6;
    const gain = ctx.createGain(); gain.gain.value=0.5;
    noise.connect(filter); filter.connect(gain); gain.connect(masterGain);
    noise.start();

    // occasional low thunder swell
    const thunderTimer = setInterval(()=>{
      if(Math.random() < 0.35){
        const osc = ctx.createOscillator();
        osc.type='sine'; osc.frequency.value = 45 + Math.random()*20;
        const tg = ctx.createGain(); tg.gain.value = 0;
        osc.connect(tg); tg.connect(masterGain);
        const t = ctx.currentTime;
        tg.gain.linearRampToValueAtTime(0.25, t+1.2);
        tg.gain.linearRampToValueAtTime(0, t+4);
        osc.start(t); osc.stop(t+4.2);
      }
    }, 3500);

    return ()=>{ clearInterval(thunderTimer); noise.stop(); noise.disconnect(); filter.disconnect(); gain.disconnect(); };
  }

  function genHum(){
    ensureCtx();
    const t = ctx.currentTime;
    const osc1 = ctx.createOscillator(); osc1.type='sine'; osc1.frequency.value=55;
    const osc2 = ctx.createOscillator(); osc2.type='sine'; osc2.frequency.value=58.5;
    const filter = ctx.createBiquadFilter(); filter.type='lowpass'; filter.frequency.value=300;
    const lfo = ctx.createOscillator(); lfo.frequency.value=0.07;
    const lfoGain = ctx.createGain(); lfoGain.gain.value=120;
    lfo.connect(lfoGain); lfoGain.connect(filter.frequency);
    const gain = ctx.createGain(); gain.gain.value=0.35;
    osc1.connect(filter); osc2.connect(filter); filter.connect(gain); gain.connect(masterGain);
    osc1.start(t); osc2.start(t); lfo.start(t);

    // occasional water-drip blip
    const dripTimer = setInterval(()=>{
      if(Math.random() < 0.4){
        const d = ctx.createOscillator(); d.type='sine';
        d.frequency.setValueAtTime(1200 + Math.random()*400, ctx.currentTime);
        d.frequency.exponentialRampToValueAtTime(300, ctx.currentTime+0.25);
        const dg = ctx.createGain(); dg.gain.value=0.15;
        d.connect(dg); dg.connect(masterGain);
        dg.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+0.3);
        d.start(); d.stop(ctx.currentTime+0.32);
      }
    }, 2200);

    return ()=>{ clearInterval(dripTimer); osc1.stop(); osc2.stop(); lfo.stop(); osc1.disconnect(); osc2.disconnect(); filter.disconnect(); gain.disconnect(); };
  }

  function genSynth(){
    ensureCtx();
    const bassOsc = ctx.createOscillator(); bassOsc.type='sawtooth'; bassOsc.frequency.value=55;
    const bassFilter = ctx.createBiquadFilter(); bassFilter.type='lowpass'; bassFilter.frequency.value=220;
    const bassGain = ctx.createGain(); bassGain.gain.value=0.25;
    bassOsc.connect(bassFilter); bassFilter.connect(bassGain); bassGain.connect(masterGain);
    bassOsc.start();

    const delay = ctx.createDelay(); delay.delayTime.value=0.32;
    const feedback = ctx.createGain(); feedback.gain.value=0.32;
    delay.connect(feedback); feedback.connect(delay);
    const delayOut = ctx.createGain(); delayOut.gain.value=0.5;
    delay.connect(delayOut); delayOut.connect(masterGain);

    const scale = [220,261.6,293.7,329.6,392,440]; // A minor-ish
    let step = 0;
    const arpGain = ctx.createGain(); arpGain.gain.value=0.16;
    arpGain.connect(masterGain); arpGain.connect(delay);

    const arpTimer = setInterval(()=>{
      const freq = scale[step % scale.length] * (step % 8 < 4 ? 1 : 2);
      step++;
      const o = ctx.createOscillator(); o.type='square'; o.frequency.value=freq;
      const g = ctx.createGain(); g.gain.value=0;
      o.connect(g); g.connect(arpGain);
      const t = ctx.currentTime;
      g.gain.linearRampToValueAtTime(0.5, t+0.02);
      g.gain.exponentialRampToValueAtTime(0.001, t+0.28);
      o.start(t); o.stop(t+0.3);
    }, 260);

    return ()=>{
      clearInterval(arpTimer);
      bassOsc.stop(); bassOsc.disconnect(); bassFilter.disconnect(); bassGain.disconnect();
      delay.disconnect(); feedback.disconnect(); delayOut.disconnect(); arpGain.disconnect();
    };
  }

  const builtIn = [
    { id:'rain',  name:'Gotham Rain',       cat:'SIDE A · AMBIENT', gen:genRain },
    { id:'hum',   name:'Batcave Hum',       cat:'SIDE A · DRONE',   gen:genHum },
    { id:'synth', name:'Night Patrol Synth',cat:'SIDE B · SYNTH',   gen:genSynth },
  ];
  const uploaded = []; // {id, name, cat, file}
  let playlist = builtIn.slice();
  let currentIndex = 0;

  function stopCurrentSource(){
    if(currentStopFn){ try{ currentStopFn(); }catch(e){} currentStopFn = null; }
    if(mediaEl){ mediaEl.pause(); mediaEl.src=''; mediaEl = null; }
  }

  function loadTrack(index, autoplay){
    stopCurrentSource();
    currentIndex = ((index % playlist.length) + playlist.length) % playlist.length;
    const track = playlist[currentIndex];
    labelName.textContent = track.name;
    trackTitleEl.querySelector('span').textContent = track.name.toUpperCase();
    counterValue = 0;
    counterEl.textContent = '0000';
    renderShelf();
    if(autoplay && powered) startPlayback();
  }

  function startPlayback(){
    if(!powered) return;
    ensureCtx();
    const track = playlist[currentIndex];
    if(track.type === 'file'){
      if(!mediaEl){
        mediaEl = new Audio(track.url);
        mediaEl.loop = true;
        const src = ctx.createMediaElementSource(mediaEl);
        src.connect(masterGain);
      }
      mediaEl.play();
    } else {
      if(!currentStopFn) currentStopFn = track.gen();
    }
    playing = true;
    body.classList.add('playing');
    playIcon.innerHTML = '<rect x="6" y="5" width="4" height="14"></rect><rect x="14" y="5" width="4" height="14"></rect>';
    statusText.textContent = 'PLAYING';
    startCounter();
    startEQ();
  }

  function pausePlayback(){
    if(mediaEl) mediaEl.pause();
    playing = false;
    body.classList.remove('playing');
    playIcon.innerHTML = '<path d="M8 5v14l11-7z"></path>';
    statusText.textContent = powered ? 'PAUSED' : 'STANDBY';
    stopCounter();
  }

  function stopPlayback(){
    stopCurrentSource();
    pausePlayback();
    counterValue = 0;
    counterEl.textContent = '0000';
    statusText.textContent = powered ? 'STOPPED' : 'STANDBY';
  }

  function startCounter(){
    stopCounter();
    counterInterval = setInterval(()=>{
      counterValue++;
      counterEl.textContent = String(counterValue % 10000).padStart(4,'0');
    }, 1000);
  }
  function stopCounter(){ if(counterInterval){ clearInterval(counterInterval); counterInterval=null; } }

  function startEQ(){
    if(rafId) return;
    function tick(){
      if(!playing){ rafId = null; eqBars.forEach(b=>b.style.height='6%'); return; }
      if(analyser){
        analyser.getByteFrequencyData(dataArray);
        for(let i=0;i<eqBars.length;i++){
          const v = dataArray[i % dataArray.length] / 255;
          eqBars[i].style.height = Math.max(6, v*100) + '%';
        }
      }
      rafId = requestAnimationFrame(tick);
    }
    rafId = requestAnimationFrame(tick);
  }

  // ---------- power ----------
  function setPowered(on){
    powered = on;
    powerToggle.setAttribute('aria-checked', on ? 'true' : 'false');
    if(on){
      body.classList.add('powered');
      ensureCtx();
      statusText.textContent = 'BOOTING…';
      setTimeout(()=>{ if(powered) statusText.textContent = 'STANDBY'; }, 550);
      if(!playlist.length) return;
      if(!trackTitleEl.querySelector('span').textContent || trackTitleEl.querySelector('span').textContent === '—'){
        loadTrack(currentIndex, false);
      }
    } else {
      body.classList.remove('powered');
      stopPlayback();
      statusText.textContent = 'STANDBY';
      if(ctx && ctx.state === 'running') ctx.suspend();
    }
  }

  powerToggle.addEventListener('click', ()=> setPowered(!powered));

  playBtn.addEventListener('click', ()=>{
    if(!powered) setPowered(true);
    if(playing) pausePlayback(); else startPlayback();
  });
  stopBtn.addEventListener('click', stopPlayback);
  prevBtn.addEventListener('click', ()=> loadTrack(currentIndex-1, true));
  nextBtn.addEventListener('click', ()=> loadTrack(currentIndex+1, true));

  // ---------- volume knob (drag to rotate) ----------
  let dragging = false, startY = 0, startVol = volume;
  function setVolumeVisual(v){
    const angle = -135 + v*270;
    volTick.style.transform = 'translateX(-50%) rotate(' + angle + 'deg)';
  }
  function setVolume(v){
    volume = Math.min(1, Math.max(0, v));
    if(masterGain) masterGain.gain.value = volume;
    setVolumeVisual(volume);
  }
  volKnob.addEventListener('pointerdown', (e)=>{
    dragging = true; startY = e.clientY; startVol = volume;
    volKnob.setPointerCapture(e.pointerId);
  });
  volKnob.addEventListener('pointermove', (e)=>{
    if(!dragging) return;
    const delta = (startY - e.clientY) / 120;
    setVolume(startVol + delta);
  });
  volKnob.addEventListener('pointerup', ()=> dragging=false);
  volKnob.addEventListener('pointercancel', ()=> dragging=false);
  setVolume(volume);

  // ---------- file upload ----------
  fileInput.addEventListener('change', (e)=>{
    const files = Array.from(e.target.files || []);
    files.forEach(file=>{
      const url = URL.createObjectURL(file);
      const name = file.name.replace(/\.[^/.]+$/, '');
      uploaded.push({ id:'up-'+Date.now()+Math.random(), name, cat:'SIDE A · YOUR TAPE', type:'file', url });
    });
    playlist = builtIn.concat(uploaded);
    renderShelf();
    if(files.length){
      loadTrack(playlist.length-1, true);
      if(!powered) setPowered(true);
    }
    fileInput.value = '';
  });

  // ---------- shelf ----------
  function renderShelf(){
    shelfRow.innerHTML = '';
    playlist.forEach((t, i)=>{
      const card = document.createElement('div');
      card.className = 'tape-card' + (i===currentIndex ? ' active' : '');
      card.innerHTML =
        '<div class="cat">'+t.cat+'</div>' +
        '<div class="name">'+t.name+'</div>' +
        '<div class="reel-mini"><i></i><i></i></div>';
      card.addEventListener('click', ()=>{
        if(!powered) setPowered(true);
        loadTrack(i, true);
      });
      shelfRow.appendChild(card);
    });
    const uploadCard = document.createElement('label');
    uploadCard.className = 'tape-card upload';
    uploadCard.innerHTML = '<div class="plus">+</div><span>Insert tape</span>';
    uploadCard.addEventListener('click', (e)=>{ e.preventDefault(); fileInput.click(); });
    shelfRow.appendChild(uploadCard);
  }

  // init
  eqBars.forEach(b=>b.style.height='6%');
  renderShelf();
  loadTrack(0, false);

})();
</script>
</body>
</html>
